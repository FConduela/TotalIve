<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Gestión de Clientes - Totales</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="menu-superior" aria-label="Navegación principal">
    <a href="#" id="menu-inicio" class="menu-item activo">Inicio</a>
    <a href="#tabla" id="menu-tabla" class="menu-item">Tabla de clientes</a>
  </nav>
  <div class="app">
    <!-- Página principal -->
    <div id="pagina-inicio" class="pagina activa">
      <div class="paneles paneles-solo-clientes">
        <section class="card panel panel-clientes">
          <div class="section-header section-header-clientes">
            <h2>Clientes</h2>
            <button type="button" class="btn btn-add btn-icon-only" id="btn-abrir-modal-nuevo-cliente" title="Nuevo cliente" aria-label="Nuevo cliente">
              <svg class="icono-persona-mas" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <line x1="19" y1="8" x2="19" y2="14"></line>
                <line x1="22" y1="11" x2="16" y2="11"></line>
              </svg>
            </button>
            <button type="button" class="btn btn-danger btn-icon-only" id="btn-eliminar-cliente" title="Eliminar cliente seleccionado" aria-label="Eliminar cliente">
              <svg class="icono-eliminar" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                <line x1="10" y1="11" x2="10" y2="17"></line>
                <line x1="14" y1="11" x2="14" y2="17"></line>
              </svg>
            </button>
          </div>
          <div class="scroll-list" id="lista-clientes">
            <!-- Botones de clientes generados en JS -->
          </div>
        </section>
        <div class="total-general-debajo">
          <div class="badge badge-total" id="total-general">Total General: $0</div>
        </div>
      </div>
    </div>

    <!-- Página Tabla de Clientes -->
    <div id="pagina-tabla" class="pagina">
      <div class="card section-tabla pagina-tabla-header">
        <div class="section-header">
          <h2>Tabla de Clientes</h2>
          <button type="button" class="btn btn-warning btn-sm" id="btn-eliminar-valor-tabla">Eliminar Valor</button>
        </div>
      </div>
      <section class="card section-tabla section-tabla-content">
        <div class="table-wrapper">
          <table class="tabla-clientes" id="tabla-clientes">
            <thead>
              <tr id="tabla-head-row">
                <th class="col-nombre">Nombre</th>
                <th class="col-total">Total</th>
              </tr>
            </thead>
            <tbody id="tabla-body">
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </div>

  <!-- Modal Nuevo Cliente -->
  <div id="modal-nuevo-cliente" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-nuevo-cliente-titulo" hidden>
    <div class="modal-caja modal-nuevo-cliente-caja">
      <div class="modal-nuevo-cliente-header">
        <h3 id="modal-nuevo-cliente-titulo" class="modal-titulo">Nuevo Cliente</h3>
        <button type="button" class="btn btn-danger btn-icon-only btn-cerrar-modal" id="btn-cerrar-modal-nuevo-cliente" aria-label="Cerrar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="modal-nuevo-cliente-body">
        <div class="field-group">
          <label for="input-nombre">Nombre del Cliente</label>
          <input type="text" id="input-nombre" placeholder="Ingresa el nombre..." autocomplete="off">
        </div>
        <div class="field-group">
          <label for="input-valor-inicial">Valor Inicial</label>
          <input type="number" id="input-valor-inicial" placeholder="Valor..." min="0" inputmode="numeric" autocomplete="off">
        </div>
        <button type="button" class="btn btn-add" id="btn-agregar-cliente">+ Agregar Cliente</button>
      </div>
    </div>
  </div>

  <!-- Modal Valores (se abre al hacer clic en un cliente) -->
  <div id="modal-valores" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-valores-titulo" hidden>
    <div class="modal-caja modal-valores-caja">
      <div class="modal-valores-header">
        <h3 id="modal-valores-titulo" class="modal-titulo">Valores</h3>
        <button type="button" class="btn btn-danger btn-icon-only btn-cerrar-modal-valores" id="btn-cerrar-modal-valores" aria-label="Cerrar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="modal-valores-body">
        <div class="section-header section-valores-header">
          <div class="detalle-option">
            <label for="check-detalle">Detalle:</label>
            <input type="checkbox" id="check-detalle" title="Marcar valor como detalle (se muestra entre paréntesis)">
          </div>
        </div>
        <div class="valores-grid" id="valores-grid">
          <button type="button" class="btn btn-valor" data-valor="0">0</button>
          <button type="button" class="btn btn-valor" data-valor="500">500</button>
          <button type="button" class="btn btn-valor" data-valor="1000">1000</button>
          <button type="button" class="btn btn-valor" data-valor="1500">1500</button>
          <button type="button" class="btn btn-valor" data-valor="2000">2000</button>
          <button type="button" class="btn btn-valor" data-valor="2500">2500</button>
          <button type="button" class="btn btn-valor" data-valor="3000">3000</button>
          <button type="button" class="btn btn-valor" data-valor="3500">3500</button>
          <button type="button" class="btn btn-valor" data-valor="4000">4000</button>
          <button type="button" class="btn btn-valor" data-valor="4500">4500</button>
          <button type="button" class="btn btn-valor" data-valor="5000">5000</button>
          <button type="button" class="btn btn-valor" data-valor="5500">5500</button>
        </div>
        <div class="form-row valor-personalizado">
          <input type="number" id="input-valor-personalizado" placeholder="Otro valor" min="0" inputmode="numeric" autocomplete="off">
          <button type="button" class="btn btn-add btn-icon" id="btn-valor-personalizado" title="Agregar valor">+</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast global (valor agregado / valor eliminado / cliente eliminado) -->
  <div id="toast-mensaje" class="toast-mensaje" role="status" aria-live="polite"></div>

  <!-- Modal confirmar eliminar valor -->
  <div id="modal-eliminar-valor" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-eliminar-valor-titulo" hidden>
    <div class="modal-caja modal-eliminar-valor-caja">
      <h3 id="modal-eliminar-valor-titulo" class="modal-titulo">¿Seguro que desea eliminar el valor?</h3>
      <div class="modal-botones modal-botones-iconos">
        <button type="button" class="btn btn-modal-rechazar" id="modal-eliminar-valor-cancelar" aria-label="Rechazar">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
        <button type="button" class="btn btn-modal-aceptar" id="modal-eliminar-valor-confirmar" aria-label="Aceptar">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Modal confirmar eliminar cliente -->
  <div id="modal-eliminar-cliente" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-eliminar-titulo" hidden>
    <div class="modal-caja modal-eliminar-cliente-caja">
      <h3 id="modal-eliminar-titulo" class="modal-titulo">¿Desea eliminar a …?</h3>
      <div class="modal-botones modal-botones-iconos">
        <button type="button" class="btn btn-modal-rechazar" id="modal-eliminar-cancelar" aria-label="Rechazar">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
        <button type="button" class="btn btn-modal-aceptar" id="modal-eliminar-confirmar" aria-label="Aceptar">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </button>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
